version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: hospital-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: hospital_management
    volumes:
      - mongodb_data:/data/db
    networks:
      - hospital-network

  # Backend Spring Boot Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:password@mongodb:27017/hospital_management?authSource=admin
      SPRING_PROFILES_ACTIVE: docker
      ML_SERVICE_URL: http://ml-service:5000
    depends_on:
      - mongodb
      - ml-service
    networks:
      - hospital-network

  # ML Service (Python Flask)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: hospital-ml-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      PYTHONPATH: /app
    volumes:
      - ./ml-service/model:/app/model
      - ./ml-service/data:/app/data
    networks:
      - hospital-network

  # Frontend React Application
  frontend:
    build:
      context: ./frontend/hospital-management
      dockerfile: Dockerfile
    container_name: hospital-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://backend:8080
      REACT_APP_ML_SERVICE_URL: http://ml-service:5000
    depends_on:
      - backend
    networks:
      - hospital-network

volumes:
  mongodb_data:

networks:
  hospital-network:
    driver: bridge
