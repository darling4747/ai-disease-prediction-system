# Spring Boot Application Configuration
spring.application.name=hospital
server.port=8080
server.address=0.0.0.0

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/hospital_management}
spring.data.mongodb.database=hospital_management

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Logging Configuration
logging.level.com.example.hospital=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Development Profile
spring.profiles.active=dev
